[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-lite"
version = "0.1.0"
description = "Pure offline, zero-LLM-cost retrieval evaluation toolkit (Recall@K, MRR, nDCG, dual-caliber match, cold-cache warmup)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kun Wang" }]
keywords = ["rag", "evaluation", "mrr", "recall", "search", "metrics", "offline-eval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/wangkun5212-hue/rag-eval-lite"
Repository = "https://github.com/wangkun5212-hue/rag-eval-lite"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_eval_lite*"]
